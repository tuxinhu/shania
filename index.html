<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shania Agent</title>
    <script>
      // 首屏渲染前先定主题：否则深色模式下会先闪一下白底
      try {
        var cached = localStorage.getItem('shania.settings.v1')
        var mode = cached ? JSON.parse(cached).theme : 'system'
        if (!mode || mode === 'system') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = mode
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
