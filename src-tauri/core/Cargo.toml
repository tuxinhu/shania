[package]
name = "shania-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Shania Agent 的 Agent 核心：SSE 解析、多轮工具循环、内置工具。不依赖 Tauri，桌面端与 CLI 共用。"

[features]
default = []
# 流式语音识别（sherpa-onnx）。只在桌面端开：它静态链接 onnxruntime，
# 会把二进制撑大几十 MB，命令行用不上。
stream-stt = ["dep:sherpa-onnx", "dep:tar", "dep:bzip2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "charset",
  "http2",
  "multipart",
] }
base64 = "0.22"
futures-util = "0.3"
# 流式模型是 .tar.bz2（134MB），这两块只在 stream-stt 下编译
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.4", optional = true }
# 用 shared 而不是默认的 static：static 包是拿较新的 MSVC STL（14.40+）编的，
# 在 VS 2022 17.7（MSVC 14.37）上链接会缺 `__std_remove_2` 这类新符号，
# 报一堆 LNK2001/2019。DLL 内部已经把 STL 静态链好了，我们只调 C API，
# 本地链接只需要导入库，不依赖具体 STL 版本。
# 代价是运行时要把 sherpa-onnx-c-api.dll / onnxruntime.dll 放在 exe 旁边
# （build.rs 会自动拷到 target/{debug,release}）。
sherpa-onnx = { version = "2.0.1", optional = true, default-features = false, features = [
  "shared",
] }
chrono = "0.4"
tokio = { version = "1", features = ["process", "io-util", "time", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
